<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 208 100'%3E%3Crect width='100' height='100' rx='12' fill='%23171717'/%3E%3Crect x='108' width='100' height='100' rx='12' fill='%23171717'/%3E%3Crect x='122' y='14' width='72' height='72' rx='5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  /* CaSe Studio web. Vercel's monochrome discipline and hairlines, Apple's quiet gallery and pills.
     Layout idea: full-bleed pages with thin gutters, one authored motion moment per page. */
  --paper:#fafafa; --surface:#ffffff; --mist:#f4f4f5; --hair:#e8e8e8; --line:#d4d4d4;
  --ink:#171717; --ink-2:#4a4a4a; --muted:#666666; --night:#0b0b0c; --night-2:#161618;
  --calcio:#f0531c; --selenio:#1e6bff; --action:#155eef; --ok:#1f7a3a;
  /* round two: white, black and blue */
  --abyss:#04060b; --deep:#0a1f5c; --blue:#1e6bff; --blue-2:#3d8bff; --ice:#e8f0ff; --ice-2:#cfe0ff; --steel:#9aa8bd;
  --dot:"Doto", var(--mono, ui-monospace), monospace;
  --font:"Funnel Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Martian Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --gutter:clamp(16px, 2.4vw, 40px);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --r-card:14px; --r-media:20px;
  --t-display:calc(clamp(44px, 6.4vw, 96px) * var(--hs, 1));
  --t-h2:calc(clamp(32px, 3.6vw, 56px) * var(--hs, 1));
  /* type set: Funnel Display for headlines and element symbols, Funnel Sans for text, Martian Mono (narrowed) for atomic numbers and data */
  --body:var(--font);
  --head:"Funnel Display", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --sym:"Funnel Display", ui-sans-serif, system-ui, sans-serif;
  --head-w:500; --head-ls:-.035em; --head-lh:1; --hs:1;
  --t-lead:clamp(17px, 1.32vw, 21px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;caret-color:var(--action);
  scrollbar-color:#c4c4c4 transparent;scrollbar-width:thin}
::selection{background:rgba(30,107,255,.2)}
:focus-visible{outline:2px solid var(--action);outline-offset:2px;border-radius:6px}
img,svg,canvas{display:block;max-width:100%}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{text-wrap:balance;font-weight:500}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{padding-inline:var(--gutter)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:0;font-variant-numeric:tabular-nums}
.display{font-family:var(--head);font-size:var(--t-display);line-height:var(--head-lh);letter-spacing:var(--head-ls);font-weight:var(--head-w)}
.h2{font-family:var(--head);font-size:var(--t-h2);line-height:calc(var(--head-lh) + .05);letter-spacing:calc(var(--head-ls) * .75);font-weight:var(--head-w)}
.lead{font-family:var(--body);font-size:var(--t-lead);line-height:1.45;color:var(--ink-2);max-width:34em}
/* the two other finalists, kept on the type bar to compare in place. Only Martian Mono has a width axis, so the stretch touches nothing else */
html{font-stretch:87.5%}
html[data-type="schibsted"]{--font:"Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;--head:"Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;--sym:"Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;--mono:"IBM Plex Mono", ui-monospace, monospace;--head-w:600;--head-ls:-.04em}
html[data-type="newsreader"]{--font:"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;--head:"Newsreader", Georgia, serif;--sym:"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;--head-w:400;--head-ls:-.025em;--head-lh:1.04;--hs:1.04}

/* logo (symbols live at the top of body) */
.logo{display:block;height:26px;width:auto;aspect-ratio:3.837;color:var(--ink);fill:currentColor;transition:color 200ms ease}
.logo--dark{color:#fff}

/* navigation: 64px, words draw a 1px line under them */
.nav{position:relative;z-index:5;height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-inline:var(--gutter)}
.nav__home{display:flex;align-items:center;min-height:44px;text-decoration:none}
.nav__links{display:flex;gap:28px;font-size:15px}
.nav__links a{position:relative;color:var(--ink-2);text-decoration:none;padding-block:10px;transition:color 150ms ease}
.nav__links a::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform 150ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){
  .nav__links a:hover{color:var(--ink)}
  .nav__links a:hover::after{transform:scaleX(1);transform-origin:left}
}
.nav--dark .nav__links a{color:#c9c9cc}
@media (hover:hover) and (pointer:fine){.nav--dark .nav__links a:hover{color:#fff}}
@media (max-width:860px){.nav__links{display:none}}

/* buttons: step 1px up on hover, sink and press on click */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;
  border:1px solid transparent;font:500 15px/1 var(--font);letter-spacing:-.01em;text-decoration:none;cursor:pointer;white-space:nowrap;
  transition:transform 150ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,color 150ms ease}
.btn--sm{min-height:44px;padding:0 18px;font-size:14px}
.btn--ink{background:var(--ink);color:#fff}
.btn--white{background:#fff;color:var(--ink)}
.btn--ghost-dark{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.btn .arr{width:14px;height:14px;transition:transform 150ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{transform:translateY(-1px)}
  .btn:hover .arr{transform:translateX(3px)}
  .btn--ink:hover{background:#2e2e2e}
  .btn--white:hover{background:#ececec}
  .btn--ghost-dark:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.5)}
}
.btn:active{transform:translateY(1px) scale(.985);transition-duration:90ms}

/* hero entrance: lines rise out of masks, then the lead and actions, the picture settles; about 1.1 s, once */
.ln{display:block;overflow:hidden;padding-bottom:.12em;margin-bottom:-.12em}
.ln>span{display:inline-block}
.is-entering .ln>span{animation:lnUp 700ms var(--ease-out) both;animation-delay:calc(var(--i,0)*80ms)}
.is-entering .up{animation:fadeUp 520ms var(--ease-out) both;animation-delay:calc(260ms + var(--i,0)*60ms)}
@keyframes lnUp{from{transform:translateY(112%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes settle{from{transform:scale(.98)}}

/* a scroll moment: a tall section whose stage stays on screen while the page scrolls natively */
.moment{position:relative;height:var(--mh,260vh)}
.moment__stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}

/* shared client-site mockups (fictional clients) */

/* contact: the anchor every main action scrolls to */
.contact{background:var(--mist);padding:clamp(72px,10vw,140px) 0}
.contact__in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto auto 1fr;column-gap:20px;row-gap:22px}
.contact__in h2{grid-column:1/7}
.contact__in .lead{grid-column:1/6}
.contact__form{grid-column:7/13;grid-row:1/4;display:grid;gap:14px;align-content:start}
.field{display:grid;gap:6px}
.field label{font-size:14px;color:var(--ink-2)}
.field input{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  transition:border-color 140ms ease,box-shadow 140ms ease}
.field input:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px rgba(21,94,239,.16)}
.contact__form .btn{justify-self:start}
.contact__ok{min-height:1.5em;font-size:15px;color:var(--ok)}
.contact__mail{grid-column:1/7;align-self:end;font-size:15px;color:var(--ink-2)}
@media (max-width:860px){
  .contact__in{grid-template-columns:1fr;grid-template-rows:none}
  .contact__in h2,.contact__in .lead,.contact__form,.contact__mail{grid-column:1/-1;grid-row:auto}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .is-entering .ln>span,.is-entering .up{animation:none}
  .btn,.btn .arr,.nav__links a::after{transition-property:background-color,border-color,color,opacity}
}

/* the font picker at the bottom: a prototype aid that goes away once the type set is chosen */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,0.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(0.23,1,0.32,1),width 250ms cubic-bezier(0.23,1,0.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,0.85)}
.proto-picker-item:active{transform:scale(0.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,0.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
</style>
<script>
/* shared runtime */
window.VARIANTS = [];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const range = (p, a, b) => clamp01((p - a) / (b - a));            /* 0..1 inside [a, b] */
const easeIO = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const lerp = (a, b, t) => a + (b - a) * t;
/* Scroll moment: progress 0..1 of a .moment section while its stage is pinned. Native scroll, one read a frame. */
function moment(section, update) {
  let raf = 0;
  const calc = () => {
    raf = 0;
    const r = section.getBoundingClientRect();
    const total = section.offsetHeight - window.innerHeight;
    update(total > 0 ? clamp01(-r.top / total) : 1);
  };
  const onScroll = () => { if (!raf) raf = requestAnimationFrame(calc); };
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll);
  calc();
  return () => { removeEventListener('scroll', onScroll); removeEventListener('resize', onScroll); cancelAnimationFrame(raf); };
}
</script>
<style>
/* the page root and the bits the hero shares with the rest */
.v{position:relative;background:var(--paper);color:var(--ink);overflow-x:clip}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.arr{width:14px;height:14px;flex:none}

/* pause control for anything that keeps moving */
.pause{display:inline-grid;place-items:center;flex:none;width:36px;height:36px;padding:0;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;transition:transform 150ms var(--ease-out),background-color 150ms ease,border-color 150ms ease}
.pause svg{width:14px;height:14px}
.pause .i-play,.pause[data-paused="1"] .i-pause{display:none}
.pause[data-paused="1"] .i-play{display:block}
@media (hover:hover) and (pointer:fine){.pause:hover{background:var(--mist);border-color:#b8b8b8}}
.pause:active{transform:scale(.94)}
.pause--dark{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:#fff}
@media (hover:hover) and (pointer:fine){.pause--dark:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}}

.proto-picker .proto-picker-item{white-space:nowrap}
.type-picker .tp-label{padding:0 8px 0 10px;color:rgba(255,255,255,.4);font-size:12px;letter-spacing:.02em}
/* the picker scrolls sideways on narrow screens instead of running off both edges */
@media (max-width:860px){
  .proto-picker{max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
  .proto-picker::-webkit-scrollbar{display:none}
  .proto-picker-item{flex:none}
}

@media (prefers-reduced-motion:reduce){
  .moment{height:auto!important}
  .pause{display:none}
}

/* the hero is its own scroll moment: the stage stays while the page scrolls */
.hx{position:relative;height:var(--hh,200vh)}
.hx__stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;isolation:isolate}
.hx__vis{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%}
.hx .nav{position:absolute;top:0;left:0;right:0;z-index:6}
.hx__copy{position:relative;z-index:2;will-change:transform,opacity}
.hx__say{position:absolute;z-index:3;left:50%;top:50%;width:min(19em,calc(100% - 2*var(--gutter)));transform:translate(-50%,-50%);text-align:center;opacity:0;pointer-events:none}
.hx__pause{position:absolute;z-index:6;right:var(--gutter);bottom:20px}
.is-entering .vis-in{animation:visIn 1600ms var(--ease-out) both}
@keyframes visIn{from{opacity:0}}

/* client wordmarks: fictional placeholders until there are real ones */

@media (prefers-reduced-motion:reduce){
  .moment__stick.is-flow{position:static;height:auto;overflow:visible;padding-block:clamp(64px,10vw,120px)}
  .hx{height:auto!important}
  .is-entering .vis-in{animation:none}
}
</style>
<style>
/* Hero: the whole periodic table as a floor of tiles drawn like the logo's. Calcium and selenium float over their squares;
   at rest an element lights up here and there, and the scroll lifts the camera, lets the table fall away and brings Ca and Se
   together as the mark. */
.v-tab{background:#02040a;color:#fff}
.v-tab ::selection{background:rgba(61,139,255,.45)}
.v-tab .b-copy{position:absolute;z-index:2;left:0;right:0;top:64px;display:grid;justify-items:center;gap:22px;padding:clamp(20px,6vh,64px) var(--gutter) 0;text-align:center}
.v-tab .b-h1{font-size:calc(clamp(40px,5.6vw,84px) * var(--hs,1))}
.v-tab .b-copy .lead{margin-inline:auto;max-width:30em;color:#b3bfd3}
.v-tab .b-copy .acts{justify-content:center}
.v-tab .hx__say{top:76%;color:#fff}
</style>
<style>
/* Services: four elements rise from the floor and turn over, one per service */
.v-tab .f2{background:#02040a;color:#fff}
.v-tab .f2-stick{display:flex;flex-direction:column;justify-content:center;gap:clamp(22px,5vh,52px);padding:0 var(--gutter)}
.v-tab .f2-stick::before{content:"";position:absolute;left:0;right:0;bottom:0;height:60%;background:radial-gradient(60% 80% at 50% 100%,rgba(30,107,255,.3),rgba(30,107,255,0) 72%);pointer-events:none}
.v-tab .f2-head{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:20px;align-items:end}
.v-tab .f2-head h2{grid-column:1/8}
.v-tab .f2-head .lead{grid-column:9/13;color:#b3bfd3}
.v-tab .f2-row{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:min(100%,1120px);margin-inline:auto;gap:clamp(8px,1vw,16px);perspective:1700px}
.v-tab .f2-t{position:relative;aspect-ratio:1/1.1;transform-style:preserve-3d;will-change:transform}
.v-tab .f2-f{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,1.5vw,24px);border-radius:16px;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.v-tab .f2-front{background:#0a1638;box-shadow:inset 0 0 0 1.5px rgba(118,166,255,.55)}
.v-tab .f2-front .mono{color:#8fb0ff}
.v-tab .f2-sym{font-family:var(--sym);font-weight:600;font-size:clamp(54px,6.6vw,108px);line-height:.86;letter-spacing:-.04em}
.v-tab .f2-name{margin-top:10px;font-size:clamp(14px,1.2vw,18px);color:#c7d5f5}
.v-tab .f2-back{background:linear-gradient(160deg,#fff,#c9dbff);color:var(--deep);transform:rotateY(180deg)}
.v-tab .f2-back h3{font-family:var(--head);font-weight:var(--head-w);font-size:clamp(19px,1.9vw,30px);line-height:1.05;letter-spacing:-.02em}
.v-tab .f2-back p{font-family:var(--body);font-size:clamp(14px,1.15vw,17px);line-height:1.38}
.v-tab .f2-foot{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.v-tab .f2-eq{display:flex;align-items:center;gap:10px;font-size:15px;color:#7f8ba3}
.v-tab .f2-eq b{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(118,166,255,.4);font-weight:600;color:#7f8ba3;transition:background-color 300ms ease,color 300ms ease,box-shadow 300ms ease}

@media (max-width:860px){
  .v-tab .f2-head h2,.v-tab .f2-head .lead{grid-column:1/-1}
  .v-tab .f2-head .lead{display:none}
  .v-tab .f2-row{grid-template-columns:repeat(2,minmax(0,1fr))}

  .v-tab .f2-sym{font-size:44px}
  .v-tab .f2-eq span{display:none}
}
</style>
<style>
.plus{display:inline-block;margin-left:8px;padding:4px 8px;white-space:nowrap;border-radius:999px;background:var(--blue);color:#fff;font:500 11px/1 var(--mono);font-style:normal;letter-spacing:0;vertical-align:middle}

/* ===== Redesign: a site full of the usual AI look becomes a clear one, strip by strip ===== */
.rd{background:var(--rd-bg);color:var(--rd-fg)}
.rd-stick{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:20px;align-items:center;padding:0 var(--gutter)}
.rd-stick::before{content:"";position:absolute;inset:0;background:var(--rd-glow,none);pointer-events:none}
.rd-left{grid-column:1/5;position:relative;display:grid;gap:18px;justify-items:start}
.rd-left .lead{color:var(--rd-body)}
.rd-tags{display:flex;gap:8px;margin-top:6px}
.rd-tag{padding:9px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rd-line);color:var(--rd-dim);font-size:14px;transition:background-color 260ms ease,color 260ms ease}
.rd-tag.on{background:var(--rd-fg);color:var(--rd-bg);box-shadow:none}
.rd-stage{grid-column:5/13;position:relative;aspect-ratio:16/10;max-height:76vh;justify-self:end;width:100%;perspective:1700px;border-radius:var(--rd-r,18px)}
.rd-stage>.rd-site,.rd-face{position:absolute;inset:0;overflow:hidden;border-radius:var(--rd-r,18px)}
.rd-stage>.rd-slop{box-shadow:0 50px 100px -40px var(--rd-shadow,rgba(0,0,0,.7))}
.rd-face>.rd-site{position:absolute;inset:0}
.rd-site{container-type:inline-size;display:flex;flex-direction:column}
.rd-nav{display:flex;align-items:center;gap:3cqw;padding:2.6cqw 4cqw;font-size:1.7cqw}
.rd-nav b{margin-right:auto;font-size:2.2cqw}
.rd-site em{font-style:normal;white-space:nowrap}
.rd-hero{display:grid;gap:2cqw}

<script>
/* runs a looping animation only while it is on screen, the tab is visible and nobody pressed pause */
function onVisible(el, cb) {
  const io = new IntersectionObserver(([e]) => cb(e.isIntersecting), { threshold: 0 });
  io.observe(el);
  return () => io.disconnect();
}
function runner(btn, area, play, stop) {
  let user = false, vis = true, on = false;
  const sync = () => {
    const want = !RM && !user && vis && !document.hidden;
    if (want !== on) { on = want; want ? play() : stop(); }
  };
  const toggle = () => {
    user = !user;
    if (btn) {
      btn.dataset.paused = user ? '1' : '';
      btn.setAttribute('aria-label', user ? 'Reanudar animación' : 'Pausar animación');
    }
    sync();
  };
  if (btn) btn.addEventListener('click', toggle);
  const unobs = onVisible(area, (v) => { vis = v; sync(); });
  document.addEventListener('visibilitychange', sync);
  sync();
  return {
    pause() { if (!user) toggle(); },
    cleanup() {
      if (btn) btn.removeEventListener('click', toggle);
      unobs();
      document.removeEventListener('visibilitychange', sync);
      if (on) { on = false; stop(); }
    }
  };
}
/* jump to a point inside a scroll moment (used by "link to scroll" lists) */
/* service buttons that pre-fill the contact message */


/* WebGL: one full-screen triangle and a fragment shader */


/* time loop + scroll progress + pause, shared by every hero */
function drive({ area, btn, sec, frame, scroll, onPlay, onStop }) {
  let t = 0, p = 0, raf = 0, last = 0, playing = false, q = 0;
  const paint = () => { q = 0; frame(t, p); };
  const queue = () => { if (!q && !playing) q = requestAnimationFrame(paint); };
  const tick = (now) => { t += Math.min(50, now - last) / 1000; last = now; frame(t, p); raf = requestAnimationFrame(tick); };
  const r = runner(btn, area,
    () => { playing = true; cancelAnimationFrame(q); q = 0; last = performance.now(); raf = requestAnimationFrame(tick); if (onPlay) onPlay(); },
    () => { playing = false; cancelAnimationFrame(raf); queue(); if (onStop) onStop(); });
  /* with reduced motion the hero stays at rest: headline on screen, one still frame */
  const stop = RM ? (scroll && scroll(0), () => {}) : moment(sec, (v) => { p = v; if (scroll) scroll(v); queue(); });
  if (RM) { t = 4; queue(); }
  return { cleanup() { r.cleanup(); stop(); cancelAnimationFrame(raf); cancelAnimationFrame(q); }, kick: queue };
}
/* the headline leaves, the statement arrives */
function copyOut(copy, say, p, sa = .5, sb = .74) {
  const o = easeIO(range(p, .05, .4));
  copy.style.opacity = (1 - o).toFixed(3);
  copy.style.transform = `translate3d(0,${(-o * 56).toFixed(1)}px,0)`;
  copy.style.visibility = o >= 1 ? 'hidden' : '';
  if (say) {
    const s = easeOut(range(p, sa, sb));
    say.style.opacity = s.toFixed(3);
    say.style.transform = `translate(-50%,calc(-50% + ${((1 - s) * 26).toFixed(1)}px))`;
  }
}
/* sections after the hero register here; order decides where each one goes */
window.PAGES = {};
function addSection(id, tpl, order, init) { (PAGES[id] = PAGES[id] || []).push({ tpl, order, init }); }
/* the nav sits on dark or on light depending on what is behind it */

/* the two logo tiles as sprites, drawn from the logo's own outlines (100 units a side) */
function markSprites() {
  const P = [...document.querySelectorAll('#mark-cut path')].map((p) => new Path2D(p.getAttribute('d')));
  const K = 3;
  const mk = (draw) => {
    const c = document.createElement('canvas');
    c.width = c.height = 100 * K;
    const g = c.getContext('2d');
    g.scale(K, K);
    draw(g);
    return c;
  };
  return {
    ca: mk((g) => {
      const gr = g.createLinearGradient(0, 0, 100, 100);
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#c4d8ff');
      g.fillStyle = gr; g.fill(P[0], 'evenodd');

      g.translate(-108, 0);

      g.fillStyle = '#c2d6ff'; g.fill(P[1]); g.fill(P[2]); g.fill(P[3]);

}
/* smoothed pointer in 0..1 over an element */
function pointer(el, ease = .08) {
  const m = { x: .5, y: .5, tx: .5, ty: .5, in: 0, tin: 0 };

  m.off = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerleave', lv); };
  return m;
}

  { name: 'Speedo Colombia', sym: 'Sp', nets: [['Instagram', '@speedocolombia', 'https://www.instagram.com/speedocolombia/']], bg: 'linear-gradient(150deg,#FFFFFF,#F2F2F2)', fg: '#E2231A',
    tag: 'La marca de natación en el país, con más de 70 mil seguidores en Instagram.', lead: 'Trabajamos con Speedo Colombia, la cuenta local de la marca de trajes de baño y accesorios de natación, cuidando una comunidad de más de 70 mil seguidores en Instagram.',
    did: ['Gestión de comentarios y mensajes', 'Contenido para Instagram'] },
  { name: "O'Neill Colombia", sym: "O'", nets: [['Instagram', '@oneillcolombia', 'https://www.instagram.com/oneillcolombia/']], bg: 'linear-gradient(150deg,#000000,#161616)', fg: '#FFFFFF',
    tag: 'Ropa de surf y playa con tienda en línea y envíos a toda Colombia.', lead: "Para O'Neill Colombia, la marca de ropa de surf y playa, trabajamos en Instagram para conectar el espíritu de la marca con su tienda en línea.",
    did: ['Gestión de comentarios y mensajes', 'Contenido para Instagram'] },
  { name: 'Graduados EAFIT', sym: 'Ea', nets: [['Instagram', '@graduadoseafit', 'https://www.instagram.com/graduadoseafit/']], bg: 'linear-gradient(150deg,#2447E0,#1734BE)', fg: '#FFFFFF',
    tag: 'El canal de una comunidad de más de 70.000 egresados de la universidad.', lead: 'Graduados EAFIT reúne a más de 70.000 egresados de la universidad en Medellín. En Instagram trabajamos para mantener esa comunidad cerca, informada y conectada.',
    did: ['Gestión de comentarios y mensajes', 'Contenido para Instagram'] }
];
const host = (u) => u.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
/* the page itself may not frame other sites while it lives in this prototype; on its own domain the viewer loads the real site */
const LIVE = !/claude|anthropic|localhost|127\.0\.0\.1/.test(location.hostname);

/* a tour is one tall image of n screens plus the first one again; it rests on each screen and glides to the next, like someone scrolling the site */
const tourHTML = (p, cls) => `<span class="tour${cls ? ' ' + cls : ''}" style="--f:${p.n + 1}" data-n="${p.n}"><img src="${p.tour}" alt="" decoding="async"></span>`;
const Tours = (() => {
  const live = new Map();
  const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => es.forEach((e) => { const a = live.get(e.target); if (a) { if (e.isIntersecting) a.play(); else a.pause(); } }), { rootMargin: '12% 0px' }) : null;
  const start = (root) => {
    if (RM || !root) return () => {};
    const made = [];
    root.querySelectorAll('.tour').forEach((t, i) => {
      if (live.has(t)) return;
      const n = +t.dataset.n, img = t.firstElementChild, hold = 1900, move = 950, total = n * (hold + move), kf = [];
      for (let k = 0; k <= n; k++) {
        const tr = `translate3d(-50%,${(-k * 100 / (n + 1)).toFixed(4)}%,0)`;
        if (k < n) kf.push({ transform: tr, offset: k * (hold + move) / total }, { transform: tr, offset: (k * (hold + move) + hold) / total, easing: 'cubic-bezier(.77,0,.175,1)' });
        else kf.push({ transform: tr, offset: 1 });
      }
      const a = img.animate(kf, { duration: total, iterations: Infinity, delay: -((i * 733) % total) });
      a.pause(); live.set(t, a); made.push(t);
      if (io) io.observe(t); else a.play();
    });
    return () => made.forEach((t) => { const a = live.get(t); if (a) a.cancel(); live.delete(t); if (io) io.unobserve(t); });
  };
  return { start };
})();
window.Tours = Tours;

const Viewer = (() => {
  const el = document.querySelector('.vw'), win = el.querySelector('.vw-win'), body = el.querySelector('.vw-body'), page = el.querySelector('.vw-page');
  const name = el.querySelector('.vw-name'), url = el.querySelector('.vw-url'), ext = el.querySelector('.vw-ext');
  let idx = 0, src = null, last = null, open = false, list = [], stop = null;
  const insetFor = (node) => {
    if (!node || !node.isConnected) return null;
    const r = node.getBoundingClientRect(), w = win.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) return null;
    return `inset(${Math.max(0, r.top - w.top).toFixed(1)}px ${Math.max(0, w.right - r.right).toFixed(1)}px ${Math.max(0, w.bottom - r.bottom).toFixed(1)}px ${Math.max(0, r.left - w.left).toFixed(1)}px round 12px)`;
  };
  const li = (a) => a.map((x) => `<li>${x}</li>`).join('');
  const out = (href, label) => `<a class="btn btn--white btn--sm" href="${href}" target="_blank" rel="noopener">${label} <span aria-hidden="true">↗</span></a>`;
  const projectHTML = (p) => {
    const F = ['Sector', 'Ubicación', 'Tipo de sitio', 'Idioma'], framed = LIVE && p.embed !== false;
    const info = `<aside class="vw-info"><p class="mono">${p.cat}</p><h3>${p.name}</h3><p class="vw-lead">${p.lead}</p>
      <dl>${p.facts.map((f, i) => (f ? `<div><dt>${F[i]}</dt><dd>${f}</dd></div>` : '')).join('')}</dl>
      <h4>Lo que construimos</h4><ul>${li(p.feats)}</ul><p class="vw-acts">${out(p.url, 'Visitar sitio')}</p></aside>`;
    if (framed) return `<div class="vw-split vw-split--live"><iframe src="${p.url}" title="Sitio de ${p.name}" loading="eager"></iframe>${info}</div>`;
    const why = LIVE ? `${p.name} no permite abrirse dentro de otra página, así que aquí ves su recorrido. Ábrelo en una pestaña nueva para navegarlo.`
      : `Recorrido con pantallas reales de ${p.name}. Cuando esta página esté en su propio dominio, aquí se abre el sitio real y se navega sin salir.`;
    return `<div class="vw-split"><div class="vw-shot"><div class="vw-tour">${tourHTML(p)}</div><p class="vw-why">${why}</p></div>${info}</div>`;
  };
  const brandHTML = (b) => `<div class="vw-split"><div class="vw-shot"><div class="vw-cover" style="background:${b.bg};color:${b.fg}"><i>${b.sym}</i><b>${b.name}</b><span>${b.nets.map((n) => `<em>${n[0]} · ${n[1]}</em>`).join('')}</span></div></div>
    <aside class="vw-info"><p class="mono">Redes sociales</p><h3>${b.name}</h3><p class="vw-lead">${b.lead}</p>
      <dl><div><dt>Redes</dt><dd>${b.nets.map((n) => n[0]).join(', ')}</dd></div><div><dt>Servicio</dt><dd>Community management y contenido</dd></div></dl>
      <h4>Lo que hicimos</h4><ul>${li(b.did)}</ul><p class="vw-acts">${b.nets.map((n) => out(n[2], 'Ver en ' + n[0])).join('')}</p></aside></div>`;
  const fill = (dir) => {
    const p = list[idx], brand = !!p.nets;
    if (stop) { stop(); stop = null; }
    name.innerHTML = '';
    name.append(p.name + ' ', Object.assign(document.createElement('span'), { textContent: '· ' + (brand ? 'Redes sociales' : p.kind) }));
    url.textContent = brand ? p.nets[0][1] : host(p.url);
    ext.href = brand ? p.nets[0][2] : p.url;
    ext.textContent = brand ? 'Ver en ' + p.nets[0][0] : 'Abrir en pestaña nueva';
    page.innerHTML = brand ? brandHTML(p) : projectHTML(p);
    stop = Tours.start(page);
    body.scrollTop = 0;
    if (dir && !RM) page.animate([{ opacity: 0, transform: `translate3d(${dir * 40}px,0,0)` }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.23,1,.32,1)' });
  };
  const go = (d) => { idx = (idx + d + list.length) % list.length; fill(d); };
  const close = () => {
    if (!open) return;
    open = false;
    el.classList.remove('is-in');
    const back = RM ? null : insetFor(src);
    const done = () => { el.classList.remove('is-open'); document.documentElement.classList.remove('vw-on'); if (stop) { stop(); stop = null; } page.innerHTML = ''; win.style.clipPath = ''; if (last) last.focus({ preventScroll: true }); };
    if (back) { win.style.clipPath = back; setTimeout(done, 520); } else done();
  };
  const show = (i, from, items) => {
    list = items || PROJECTS; idx = i; src = from || null; last = document.activeElement; open = true;
    fill(0);
    document.documentElement.classList.add('vw-on');
    el.classList.add('is-open');
    const start = RM ? null : insetFor(src);
    if (start) {
      win.style.transition = 'none'; win.style.clipPath = start;
      win.getBoundingClientRect();
      win.style.transition = '';
      requestAnimationFrame(() => { el.classList.add('is-in'); win.style.clipPath = 'inset(0 round 16px)'; });
      page.animate([{ transform: 'scale(1.04)' }, { transform: 'none' }], { duration: 900, easing: 'cubic-bezier(.23,1,.32,1)' });
    } else el.classList.add('is-in');
    el.querySelector('.vw-close').focus({ preventScroll: true });
  };
  el.querySelector('.vw-close').addEventListener('click', close);
  el.querySelector('.vw-back').addEventListener('click', close);
  el.querySelector('.vw-prev').addEventListener('click', () => go(-1));
  el.querySelector('.vw-next').addEventListener('click', () => go(1));
  /* while it is open the viewer owns the keyboard: Esc closes, arrows change project, Tab stays inside */
  addEventListener('keydown', (e) => {
    if (!open) return;
    e.stopImmediatePropagation();
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'Tab') {
      const f = [...el.querySelectorAll('button,a[href],[tabindex="0"]')], a = document.activeElement, i = f.indexOf(a);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  }, true);
  return { show, close };
})();
</script>

      stage.querySelectorAll('.v > section').forEach((s, i) => { const b = s.getBoundingClientRect(); if (b.top <= mid) { k = i; r = Math.min(1, Math.max(0, (mid - b.top) / b.height)); } });

      if (window.REMOUNT) window.REMOUNT();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const s = stage.querySelectorAll('.v > section')[k]; if (!s || !k) return;
        const b = s.getBoundingClientRect(); scrollTo({ top: scrollY + b.top + r * b.height - innerHeight / 2, behavior: 'instant' });
      }));
    }
  };
  /* what lives outside the page (the preview window) is translated in place and remembers its Spanish */
  const outside = [];
  const chrome = (code) => {
    while (outside.length) { const [n, a, v] = outside.pop(); if (a) n.setAttribute(a, v); else n.nodeValue = v; }
    if (code !== 'en') return;
    const walk = (n) => {
      if (n.nodeType === 3) { const t = tr(n.nodeValue); if (t !== null) { outside.push([n, null, n.nodeValue]); n.nodeValue = t; } return; }
      if (n.nodeType !== 1 || /^(SCRIPT|STYLE|TEMPLATE|TEXTAREA)$/.test(n.tagName) || n.id === 'stage' || n.classList.contains('proto-picker')) return;
      for (const a of n.attributes) if (ATTR.test(a.name)) { const t = tr(a.value); if (t !== null) { outside.push([n, a.name, a.value]); n.setAttribute(a.name, t); } }
      for (let c = n.firstChild; c; c = c.nextSibling) walk(c);
    };
    walk(document.body);
  };
  /* every switch on the page shows the language that is on, and any of them changes it */
  const mark = (root) => root.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === LANG.cur));
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-lang]'); if (b) LANG.set(b.dataset.lang); });
  window.I18N = { node: (root) => { mark(root); node(root); }, tr };
  /* whatever is written after the sections start (lists, counters, messages) is translated as it arrives */
  new MutationObserver((ms) => {
    if (LANG.cur !== 'en') return;
    for (const m of ms) {
      if (m.type === 'characterData') node(m.target);
      else if (m.type === 'attributes') { const v = m.target.getAttribute(m.attributeName), t = v && tr(v); if (t) m.target.setAttribute(m.attributeName, t); }
      else m.addedNodes.forEach(node);
    }
  }).observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['aria-label', 'placeholder', 'alt', 'title', 'data-ph'] });
})();
</script>

<main id="stage"></main>

<script>
/* Puts the page together: the hero, the sections in their order, the contact block and what FINALE adds
   (form, last line, footer, colour edges and menu). REMOUNT draws it again; the language switch uses it. */
(() => {
  const page = window.VARIANTS[0];
  const stage = document.getElementById('stage');
  let cleanup = null, first = true;

  function mount() {
    if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
    stage.innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'instant' });
    requestAnimationFrame(() => {
      const frag = document.getElementById(page.tpl).content.cloneNode(true);
      const pages = (window.PAGES[page.id] || []).slice().sort((x, y) => x.order - y.order);
      pages.forEach((pg) => frag.firstElementChild.appendChild(document.getElementById(pg.tpl).content.cloneNode(true)));
      frag.firstElementChild.appendChild(document.getElementById('tpl-contact').content.cloneNode(true));
      stage.appendChild(frag);
      const root = stage.firstElementChild;
      if (window.I18N) window.I18N.node(root);
      root.classList.add('is-entering');
      document.documentElement.style.background = getComputedStyle(root).backgroundColor;
      const done = page.init ? page.init(root) : null;
      const done2 = pages.map((pg) => pg.init(root));
      const ct = root.querySelector('.contact');
      ct.classList.add('contact--' + page.id);
      const stopTours = window.Tours ? Tours.start(root) : null;
      const fin = window.FINALE ? window.FINALE(page.id, root, ct) : null;
      cleanup = () => { if (fin) fin(); if (stopTours) stopTours(); if (typeof done === 'function') done(); done2.forEach((f) => { if (typeof f === 'function') f(); }); };
      /* a link to a section (index.html#contacto) lands on it the first time the page is drawn */
      if (first) { first = false; let t = null; try { t = location.hash.length > 1 ? stage.querySelector(location.hash) : null; } catch (e) {} if (t) t.scrollIntoView({ behavior: 'instant', block: 'start' }); }
    });
  }

  window.REMOUNT = mount;

  /* in-page links scroll to their section */
  stage.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    e.preventDefault();
    if (href === '#top') { scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); return; }
    const target = stage.querySelector(href);
    if (target) target.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' });
  });

  mount();
})();
</script>
<script>
/* type sets: the chosen one (Funnel) plus the two finalists it was weighed against; F cycles them */
(() => {
  const TYPES = [
    { id: 'funnel', name: 'Funnel + Martian Mono' },
    { id: 'schibsted', name: 'Schibsted + Plex Mono' },
    { id: 'newsreader', name: 'Newsreader + Hanken' }
  ];
  const tp = document.querySelector('.type-picker'), hl = tp.querySelector('.proto-picker-highlight');
  const btns = TYPES.map((t) => {
    const b = document.createElement('button');
    b.className = 'proto-picker-item';
    b.type = 'button';
    b.textContent = t.name;
    tp.appendChild(b);
    return b;
  });
  let cur = 0;
  try { const i = TYPES.findIndex((t) => t.id === localStorage.getItem('case-type')); if (i >= 0) cur = i; } catch (e) {}
  const move = () => { const el = btns[cur]; hl.style.width = el.offsetWidth + 'px'; hl.style.transform = `translateX(${el.offsetLeft}px)`; };
  const relayout = () => dispatchEvent(new Event('resize'));
  const set = (i) => {
    cur = (i + TYPES.length) % TYPES.length;
    document.documentElement.dataset.type = TYPES[cur].id;
    btns.forEach((b, j) => { b.toggleAttribute('data-active', j === cur); b.setAttribute('aria-pressed', j === cur ? 'true' : 'false'); });
    move();
    try { localStorage.setItem('case-type', TYPES[cur].id); } catch (e) {}
    /* fonts load after the next layout; measure again once they arrive */
    requestAnimationFrame(() => document.fonts.ready.then(relayout));
    setTimeout(relayout, 900);
  };
  btns.forEach((b, i) => b.addEventListener('click', () => set(i)));
  addEventListener('resize', move);
  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'f' || e.key === 'F') set(cur + 1);
  });
  set(cur);
  requestAnimationFrame(() => requestAnimationFrame(() => tp.setAttribute('data-ready', '')));
})();
</script>
