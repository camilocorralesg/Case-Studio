.vw-info li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:#3d8bff}
.vw-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
/* a tour fills its frame; the strip inside moves by itself */
.tour{display:block;position:relative;overflow:hidden;background:#0b0c10}
.tour>img{position:absolute;left:50%;top:0;height:calc(100% * var(--f,5));width:auto;max-width:none;transform:translate3d(-50%,0,0);will-change:transform}

@media (max-width:860px){.vw-name span,.vw-url{display:none}.vw-name{margin-right:auto}.vw-split{grid-template-columns:1fr}.vw-info{border-left:0}.vw-split--live .vw-info{display:none}.vw-ext{display:none}}

</style>

].map((p) => Object.assign(p, { img: `assets/pf-${p.id}.jpg`, tour: `assets/tour-${p.id}.webp` }));

window.BRANDS = [
  { name: 'Weed Honey', sym: 'We', nets: [['Instagram', '@weedhoney.co', 'https://www.instagram.com/weedhoney.co/'], ['TikTok', '@weedhoney.co', 'https://www.tiktok.com/@weedhoney.co']], bg: 'linear-gradient(150deg,#FFFDF7,#F6ECD6)', fg: '#B07F24',

  { name: 'Agilcash', sym: 'Ag', nets: [['Instagram', '@agilcash.co', 'https://www.instagram.com/agilcash.co/'], ['TikTok', '@agilcash.co', 'https://www.tiktok.com/@agilcash.co']], bg: 'linear-gradient(150deg,#115450,#0B3D3A)', fg: '#FFFFFF',
    tag: 'Una plataforma para pasar dólares digitales a pesos, explicada de forma clara y cercana.', lead: 'Agilcash convierte dólares digitales a pesos colombianos. Nuestro reto fue hacer que un tema financiero se entendiera fácil y generara confianza en Instagram y TikTok.',
    did: ['Gestión de comentarios y mensajes', 'Contenido para Instagram', 'Contenido para TikTok'] },
  { name: 'La Miguería', sym: 'Mi', nets: [['Instagram', '@lamigueria', 'https://www.instagram.com/lamigueria/']], bg: 'linear-gradient(150deg,#77513F,#5C3D30)', fg: '#F4E7D4',
    tag: 'Una panadería con una comunidad de más de 280 mil seguidores en Instagram.', lead: 'Acompañamos a La Miguería en Instagram, donde su comunidad supera los 280 mil seguidores, con contenido que antoja y conversaciones que no se quedan sin respuesta.',

  { name: 'Speedo Colombia', sym: 'Sp', nets: [['Instagram', '@speedocolombia', 'https://www.instagram.com/speedocolombia/']], bg: 'linear-gradient(150deg,#FFFFFF,#F2F2F2)', fg: '#E2231A',

    tag: 'Ropa de surf y playa con tienda en línea y envíos a toda Colombia.', lead: "Para O'Neill Colombia, la marca de ropa de surf y playa, trabajamos en Instagram para conectar el espíritu de la marca con su tienda en línea.",
    did: ['Gestión de comentarios y mensajes', 'Contenido para Instagram'] },
  { name: 'Graduados EAFIT', sym: 'Ea', nets: [['Instagram', '@graduadoseafit', 'https://www.instagram.com/graduadoseafit/']], bg: 'linear-gradient(150deg,#2447E0,#1734BE)', fg: '#FFFFFF',
    tag: 'El canal de una comunidad de más de 70.000 egresados de la universidad.', lead: 'Graduados EAFIT reúne a más de 70.000 egresados de la universidad en Medellín. En Instagram trabajamos para mantener esa comunidad cerca, informada y conectada.',
    did: ['Gestión de comentarios y mensajes', 'Contenido para Instagram'] }
];
const host = (u) => u.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
/* the page itself may not frame other sites while it lives in this prototype; on its own domain the viewer loads the real site */
const LIVE = !/claude|anthropic|localhost|127\.0\.0\.1/.test(location.hostname);

/* a tour is one tall image of n screens plus the first one again; it rests on each screen and glides to the next, like someone scrolling the site */
const tourHTML = (p, cls) => `<span class="tour${cls ? ' ' + cls : ''}" style="--f:${p.n + 1}" data-n="${p.n}"><img src="${p.tour}" alt="" decoding="async"></span>`;
const Tours = (() => {
  const live = new Map();
  const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => es.forEach((e) => { const a = live.get(e.target); if (a) { if (e.isIntersecting) a.play(); else a.pause(); } }), { rootMargin: '12% 0px' }) : null;
  const start = (root) => {
    if (RM || !root) return () => {};
    const made = [];
    root.querySelectorAll('.tour').forEach((t, i) => {
      if (live.has(t)) return;
      const n = +t.dataset.n, img = t.firstElementChild, hold = 1900, move = 950, total = n * (hold + move), kf = [];
      for (let k = 0; k <= n; k++) {
        const tr = `translate3d(-50%,${(-k * 100 / (n + 1)).toFixed(4)}%,0)`;
        if (k < n) kf.push({ transform: tr, offset: k * (hold + move) / total }, { transform: tr, offset: (k * (hold + move) + hold) / total, easing: 'cubic-bezier(.77,0,.175,1)' });
        else kf.push({ transform: tr, offset: 1 });
      }
      const a = img.animate(kf, { duration: total, iterations: Infinity, delay: -((i * 733) % total) });
      a.pause(); live.set(t, a); made.push(t);
      if (io) io.observe(t); else a.play();
    });
    return () => made.forEach((t) => { const a = live.get(t); if (a) a.cancel(); live.delete(t); if (io) io.unobserve(t); });
  };
  return { start };
})();
window.Tours = Tours;

const Viewer = (() => {
  const el = document.querySelector('.vw'), win = el.querySelector('.vw-win'), body = el.querySelector('.vw-body'), page = el.querySelector('.vw-page');
  const name = el.querySelector('.vw-name'), url = el.querySelector('.vw-url'), ext = el.querySelector('.vw-ext');
  let idx = 0, src = null, last = null, open = false, list = [], stop = null;
  const insetFor = (node) => {
    if (!node || !node.isConnected) return null;
    const r = node.getBoundingClientRect(), w = win.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) return null;
    return `inset(${Math.max(0, r.top - w.top).toFixed(1)}px ${Math.max(0, w.right - r.right).toFixed(1)}px ${Math.max(0, w.bottom - r.bottom).toFixed(1)}px ${Math.max(0, r.left - w.left).toFixed(1)}px round 12px)`;
  };
  const li = (a) => a.map((x) => `<li>${x}</li>`).join('');
  const out = (href, label) => `<a class="btn btn--white btn--sm" href="${href}" target="_blank" rel="noopener">${label} <span aria-hidden="true">↗</span></a>`;
  const projectHTML = (p) => {
    const F = ['Sector', 'Ubicación', 'Tipo de sitio', 'Idioma'], framed = LIVE && p.embed !== false;
    const info = `<aside class="vw-info"><p class="mono">${p.cat}</p><h3>${p.name}</h3><p class="vw-lead">${p.lead}</p>
      <dl>${p.facts.map((f, i) => (f ? `<div><dt>${F[i]}</dt><dd>${f}</dd></div>` : '')).join('')}</dl>
      <h4>Lo que construimos</h4><ul>${li(p.feats)}</ul><p class="vw-acts">${out(p.url, 'Visitar sitio')}</p></aside>`;
    if (framed) return `<div class="vw-split vw-split--live"><iframe src="${p.url}" title="Sitio de ${p.name}" loading="eager"></iframe>${info}</div>`;
    const why = LIVE ? `${p.name} no permite abrirse dentro de otra página, así que aquí ves su recorrido. Ábrelo en una pestaña nueva para navegarlo.`
      : `Recorrido con pantallas reales de ${p.name}. Cuando esta página esté en su propio dominio, aquí se abre el sitio real y se navega sin salir.`;
    return `<div class="vw-split"><div class="vw-shot"><div class="vw-tour">${tourHTML(p)}</div><p class="vw-why">${why}</p></div>${info}</div>`;
  };
  const brandHTML = (b) => `<div class="vw-split"><div class="vw-shot"><div class="vw-cover" style="background:${b.bg};color:${b.fg}"><i>${b.sym}</i><b>${b.name}</b><span>${b.nets.map((n) => `<em>${n[0]} · ${n[1]}</em>`).join('')}</span></div></div>
    <aside class="vw-info"><p class="mono">Redes sociales</p><h3>${b.name}</h3><p class="vw-lead">${b.lead}</p>
      <dl><div><dt>Redes</dt><dd>${b.nets.map((n) => n[0]).join(', ')}</dd></div><div><dt>Servicio</dt><dd>Community management y contenido</dd></div></dl>
      <h4>Lo que hicimos</h4><ul>${li(b.did)}</ul><p class="vw-acts">${b.nets.map((n) => out(n[2], 'Ver en ' + n[0])).join('')}</p></aside></div>`;
  const fill = (dir) => {
    const p = list[idx], brand = !!p.nets;
    if (stop) { stop(); stop = null; }
    name.innerHTML = '';
    name.append(p.name + ' ', Object.assign(document.createElement('span'), { textContent: '· ' + (brand ? 'Redes sociales' : p.kind) }));
    url.textContent = brand ? p.nets[0][1] : host(p.url);
    ext.href = brand ? p.nets[0][2] : p.url;
    ext.textContent = brand ? 'Ver en ' + p.nets[0][0] : 'Abrir en pestaña nueva';
    page.innerHTML = brand ? brandHTML(p) : projectHTML(p);
    stop = Tours.start(page);
    body.scrollTop = 0;
    if (dir && !RM) page.animate([{ opacity: 0, transform: `translate3d(${dir * 40}px,0,0)` }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.23,1,.32,1)' });
  };
  const go = (d) => { idx = (idx + d + list.length) % list.length; fill(d); };
  const close = () => {
    if (!open) return;
    open = false;
    el.classList.remove('is-in');
    const back = RM ? null : insetFor(src);
    const done = () => { el.classList.remove('is-open'); document.documentElement.classList.remove('vw-on'); if (stop) { stop(); stop = null; } page.innerHTML = ''; win.style.clipPath = ''; if (last) last.focus({ preventScroll: true }); };
    if (back) { win.style.clipPath = back; setTimeout(done, 520); } else done();
  };
  const show = (i, from, items) => {
    list = items || PROJECTS; idx = i; src = from || null; last = document.activeElement; open = true;
    fill(0);
    document.documentElement.classList.add('vw-on');
    el.classList.add('is-open');
    const start = RM ? null : insetFor(src);
    if (start) {
      win.style.transition = 'none'; win.style.clipPath = start;
      win.getBoundingClientRect();
      win.style.transition = '';
      requestAnimationFrame(() => { el.classList.add('is-in'); win.style.clipPath = 'inset(0 round 16px)'; });
      page.animate([{ transform: 'scale(1.04)' }, { transform: 'none' }], { duration: 900, easing: 'cubic-bezier(.23,1,.32,1)' });
    } else el.classList.add('is-in');
    el.querySelector('.vw-close').focus({ preventScroll: true });
  };
  el.querySelector('.vw-close').addEventListener('click', close);
  el.querySelector('.vw-back').addEventListener('click', close);
  el.querySelector('.vw-prev').addEventListener('click', () => go(-1));
  el.querySelector('.vw-next').addEventListener('click', () => go(1));
  /* while it is open the viewer owns the keyboard: Esc closes, arrows change project, Tab stays inside */
  addEventListener('keydown', (e) => {
    if (!open) return;
    e.stopImmediatePropagation();
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'Tab') {
      const f = [...el.querySelectorAll('button,a[href],[tabindex="0"]')], a = document.activeElement, i = f.indexOf(a);
