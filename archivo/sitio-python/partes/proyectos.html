<style>
/* Projects: the floor of elements tilts up into a grid and each element shows its site */
.pg{background:#02040a;color:#fff}
.pg-stick{display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,3vh,32px);padding:0 var(--gutter);perspective:1500px}
.pg-stick::before{content:"";position:absolute;left:0;right:0;bottom:0;height:70%;background:radial-gradient(60% 80% at 50% 100%,rgba(30,107,255,.34),rgba(30,107,255,0) 72%);pointer-events:none}
.pg-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1vw,16px);width:min(100%,calc((100svh - 210px) * 2.5));margin-inline:auto;transform-origin:50% 100%;will-change:transform}
.pg-t{position:relative;aspect-ratio:16/9.6;padding:0;border:0;border-radius:14px;overflow:hidden;background:#0a1638;color:#fff;cursor:pointer;text-align:left;box-shadow:inset 0 0 0 1.5px rgba(118,166,255,.55);transition:transform 220ms var(--ease-out)}
.pg-el{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(10px,1.2vw,18px)}
.pg-el b{font:600 clamp(40px,5.4vw,88px)/.86 var(--sym);letter-spacing:-.04em}
.pg-el span:last-child{font-size:clamp(13px,1.1vw,16px);color:#c7d5f5}
.pg-t .tour{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
.pg-t i{position:absolute;left:10px;bottom:10px;padding:7px 12px;border-radius:8px;background:#fff;color:var(--deep);font:500 13px/1 var(--font);font-style:normal;opacity:0}
@media (hover:hover) and (pointer:fine){.pg-t:hover{transform:scale(1.025)}}

@media (max-width:860px){
  .pg-grid{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
}
</style>

<template id="tpl-pg"><section class="moment pg" id="proyectos" aria-labelledby="pg-h" style="--mh:320vh"><div class="moment__stick pg-stick"><h2 class="h2" id="pg-h">Proyectos</h2><div class="pg-grid"></div></div></section></template>

<script>
/* a grid of elements; each one opens the viewer */
addSection('tabla', 'tpl-pg', 2, (root) => {
  const sec = root.querySelector('.pg'), grid = sec.querySelector('.pg-grid'), SYM = ['Ld', 'Nn', 'Nb', 'Ak', 'Wh', 'Mi'];
  grid.innerHTML = PROJECTS.map((p, i) => `<button class="pg-t" type="button" aria-label="Abrir vista previa de ${p.name}"><span class="pg-el" aria-hidden="true"><span class="mono">0${i + 1}</span><span><b>${SYM[i]}</b><br><span>${p.name}</span></span></span>${tourHTML(p)}<i>${p.name}</i></button>`).join('');
  const tiles = [...grid.children], imgs = tiles.map((t) => t.querySelector('.tour')), tags = tiles.map((t) => t.querySelector('i'));
  const offs = tiles.map((t, i) => { const fn = () => Viewer.show(i, t); t.addEventListener('click', fn); return () => t.removeEventListener('click', fn); });
  const stop = moment(sec, (p) => {
    const k = RM ? 1 : easeIO(range(p, .02, .46));
    grid.style.transform = `rotateX(${lerp(62, 0, k).toFixed(2)}deg) scale(${lerp(.78, 1, k).toFixed(4)})`;
    tiles.forEach((t, i) => {
      const o = RM ? 1 : easeOut(range(p, .44 + i * .06, .62 + i * .06));
      imgs[i].style.opacity = o.toFixed(3);
      imgs[i].style.transform = `scale(${(1.12 - o * .12).toFixed(4)})`;
      tags[i].style.opacity = o.toFixed(3);
    });
  });
  return () => { stop(); offs.forEach((f) => f()); };
});
</script>
