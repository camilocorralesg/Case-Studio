<style>
/* ===== Sections in another colour. The change of colour is an edge between two sections and the scroll moves it:
   the next colour is laid tile by tile, and the top row keeps the outline of the periodic table, with Ca and Se in their places ===== */
.edge{position:relative;display:block;height:var(--eh,52vh);overflow:hidden;pointer-events:none;background:var(--ea);contain:strict}
.edge>canvas{position:absolute;left:0;top:0;display:block;width:100%;height:100%}
@media (max-width:860px){.edge{--eh:40vh}}
/* where an edge takes over, the glow that joined the two sections steps aside */
.tone,.tone-b0{--jb:transparent}.tone,.tone-t0{--jt:transparent}


/* the process on lab paper and the closing in solid blue */
.v-tab .pq{background-color:#f4f7ff;color:#0a1020}
.v-tab .pq-t{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(118,166,255,.55),0 30px 50px -30px rgba(10,31,92,.6)}
.v-tab .pq-link{background:rgba(10,31,92,.18)}
.v-tab .pq-link::after{background:var(--blue)}
.v-tab .zb{background-color:#1b55e8}
.v-tab .zb-stick::before{background:radial-gradient(50% 50% at 50% 46%,rgba(160,196,255,.5),rgba(160,196,255,0) 70%)}
.v-tab .zb-slot{border-color:rgba(255,255,255,.7)}
.v-tab .zb-you{background:linear-gradient(#0d2a80,#071546)}

</style>
<script>
(() => {
  const rng = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
  const fit = (el, cv) => { const d = Math.min(2, devicePixelRatio || 1), W = el.clientWidth, H = el.clientHeight; cv.width = Math.round(W * d); cv.height = Math.round(H * d); return [W, H, d]; };




  /* the next colour, tile by tile */
  function mosaic(el, o, n) {
    const cv = el.appendChild(document.createElement('canvas')), ctx = cv.getContext('2d');
    const r = rng(31 + n * 7), J = Array.from({ length: 400 }, r), B = rgb(o.b), F = rgb(o.flash);
    let W = 0, H = 0, d = 1, s = 80, cells = [], font = 'sans-serif';
    const box = (x, y, w, h, q) => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, q); else ctx.rect(x, y, w, h); };
    return {
      size() {
        W = el.clientWidth; const cols = W < 700 ? 9 : 18; s = W / cols;
        const rows = Math.max(5, Math.round(innerHeight * (W < 700 ? .4 : .52) / s));
        el.style.height = Math.ceil(rows * s) + 'px';
        [W, H, d] = fit(el, cv);
        const sky = cols === 18 ? [[0, 17], [0, 1, 12, 13, 14, 15, 16, 17], [0, 1, 12, 13, 14, 15, 16, 17]] : [[0, 8], [0, 1, 6, 7, 8], [0, 1, 5, 6, 7, 8]];
        cells = [];
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          if (y < 3 && !sky[y].includes(x)) continue;
          cells.push({ x: x * s, y: y * s, t: .13 + (1 - y / (rows - 1)) * .36 + (J[(y * 18 + x) % 400] - .5) * (.34 - .22 * y / (rows - 1)), mark: y === 3 ? (x === 1 ? 'Ca' : x === (cols === 18 ? 15 : 7) ? 'Se' : '') : '' });
        }
        font = getComputedStyle(el).fontFamily;
      },
      draw(u) {
        ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, W, H);
        cells.forEach((c) => {
          const f = easeOut(range(u, c.t, c.t + .12)); if (f <= 0) return;
          const z = s * f + (f >= 1 ? .8 : 0), x = c.x + (s - z) / 2, y = c.y + (s - z) / 2;
          ctx.fillStyle = f >= 1 ? o.b : mix(F, B, f);
          if (f >= 1) ctx.fillRect(x, y, z, z); else { box(x, y, z, z, (1 - f) * s * .3); ctx.fill(); }
          if (c.mark && f >= 1) {
            const k = easeOut(range(u, c.t + .12, c.t + .26)), m = s * .1, w = s - m * 2;
            ctx.globalAlpha = k; ctx.fillStyle = o.mk; box(c.x + m, c.y + m, w, w, s * .09); ctx.fill();
            if (o.mkLine) { ctx.strokeStyle = o.mkLine; ctx.lineWidth = 1.5; ctx.stroke(); }
            ctx.fillStyle = o.mkText; ctx.font = `600 ${(s * .34).toFixed(1)}px ${font}`; ctx.textBaseline = 'alphabetic';
            ctx.fillText(c.mark, c.x + m + w * .16, c.y + m + w * .8); ctx.globalAlpha = 1;
          }
        });
      }
    };
  }

  const KIND = { mosaic };
  const TONE = {
    tabla: { kind: 'mosaic', base: '#02040a', map: [['#proceso', '#f4f7ff'], ['.zb', '#1b55e8']], look: {
      '#f4f7ff': { flash: '#9fc0ff', mk: '#1e55e0', mkText: '#ffffff' },
      '#1b55e8': { flash: '#cfe0ff', mk: '#ffffff', mkText: '#1b55e8' },
      '#02040a': { flash: '#1e6bff', mk: '#0a1638', mkText: '#ffffff', mkLine: 'rgba(118,166,255,.6)' } } }
  };

  function edges(root, id) {
    const T = TONE[id]; if (!T) return () => {};
    const colour = (s) => { const m = T.map.find(([sel]) => s.matches(sel)); return m ? m[1] : T.base; };
    const list = []; let prev = null, pc = null;
    [...root.children].filter((n) => n.matches('section,footer')).forEach((s) => {
      const c = colour(s);
      if (prev && c !== pc) {
        const el = document.createElement('div'); el.className = 'edge edge--' + T.kind; el.setAttribute('aria-hidden', 'true');
        el.style.setProperty('--ea', pc); el.style.setProperty('--eb', c);
        s.before(el); prev.classList.add('tone-b0'); s.classList.add('tone-t0');
        list.push({ el, api: KIND[T.kind](el, Object.assign({ a: pc, b: c }, T.look[c]), list.length) });
      }
      if (c !== T.base) s.classList.add('tone');
      prev = s; pc = c;
    });
    let raf = 0;
    const frame = () => {
      raf = 0; const vh = innerHeight;
      list.forEach((e) => { const r = e.el.getBoundingClientRect(); if (RM) e.api.draw(.66); else if (r.bottom > -80 && r.top < vh + 80) e.api.draw(clamp01((vh - r.top) / (vh + r.height))); });
    };
    const queue = () => { if (!raf) raf = requestAnimationFrame(frame); };
    const resize = () => { list.forEach((e) => e.api.size()); queue(); };
    list.forEach((e) => e.api.size()); frame();
    if (!RM) addEventListener('scroll', queue, { passive: true });
    addEventListener('resize', resize);
    return () => { removeEventListener('scroll', queue); removeEventListener('resize', resize); cancelAnimationFrame(raf); };
  }

  

  

  const F = window.FINALE;
  window.FINALE = (id, root, ct) => {
    const a = F ? F(id, root, ct) : null;
    const b = edges(root, id), c = null, e = null;
    return () => { b(); if (c) c(); if (e) e(); if (typeof a === 'function') a(); };
  };
})();
</script>
